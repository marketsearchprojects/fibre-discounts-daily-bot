name: Daily FibreDiscounts post

on:
  # Run at both possible UTC equivalents of 09:07 Europe/London. The Python
  # entry point rejects the run that does not map to local hour 09.
  schedule:
    - cron: "7 8,9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fibre-discounts-daily-post
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ vars.REDDIT_APPROVAL_GRANTED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install .

      - name: Test editorial and scope controls
        run: python -m unittest discover -s tests -v

      - name: Publish at most one post
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          REDDIT_APPROVAL_GRANTED: ${{ vars.REDDIT_APPROVAL_GRANTED }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_REFRESH_TOKEN: ${{ secrets.REDDIT_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REDDIT_USERNAME: FrierenInsights
          REDDIT_SUBREDDIT: FibreDiscounts
        run: fibre-discounts-bot

      - name: Persist duplicate-prevention record
        run: |
          if git diff --quiet -- state/posted.json; then
            exit 0
          fi
          git config user.name "FibreDiscounts Daily Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- state/posted.json
          git commit -m "Record published FibreDiscounts source"
          git push
